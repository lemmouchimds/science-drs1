<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة علوم الطبيعة والحياة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5ef;--card:#fff;--ink:#1f2a24;--muted:#66706a;--line:#e6e2d6;
  --l1:#c2417a;--l1s:#fbe7f0;--l2:#2f8a4e;--l2s:#e3f3e8;
  --ok:#2f8a4e;--oks:#e3f3e8;--bad:#c0392b;--bads:#fbe5e2;
  --chrom:#5246d8;--cell:#fdebd0;--cellb:#e2a865;
  --acc:var(--l1);--accs:var(--l1s);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141714;--card:#1e221f;--ink:#ecefe9;--muted:#9ba59e;--line:#2f3530;
  --l1:#f07aab;--l1s:#3a2230;--l2:#5fc983;--l2s:#1f3527;
  --ok:#5fc983;--oks:#1f3527;--bad:#f08070;--bads:#3b2220;--chrom:#9d95ff;--cell:#3a2f22;--cellb:#b98a50;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
#app{max-width:620px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1{font-size:1.45rem;margin:4px 0 2px}
h2{font-size:1.15rem;margin:0}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 18px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.2rem;flex:none}
.top .t{flex:1;min-width:0}
.top .t small{display:block;color:var(--muted);font-size:.8rem}
.lesson{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;border-inline-start:6px solid var(--c)}
.lesson b{display:block;font-size:1.08rem}
.lesson span{color:var(--muted);font-size:.88rem}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center}
.mode .ic{font-size:1.7rem;display:block}
.mode b{display:block;margin-top:4px}
.mode span{font-size:.8rem;color:var(--muted)}
.mode.wide{grid-column:1/-1}
/* flashcards */
.fc{perspective:1200px;height:300px;margin:6px 0 14px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);overflow:auto}
.front{background:var(--card)}
.front .q{font-size:1.25rem;font-weight:600}
.front .hint{position:absolute;bottom:12px;font-size:.8rem;color:var(--muted)}
.backf{background:var(--accs);transform:rotateY(180deg);font-size:1.02rem}
.backf ul{text-align:right;margin:6px 0;padding-inline-start:20px}
.tag{font-size:.75rem;color:var(--acc);font-weight:600;margin-bottom:8px}
.row{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}
.btn.ok{background:var(--oks);color:var(--ok);border-color:transparent}
.btn.no{background:var(--bads);color:var(--bad);border-color:transparent}
.btn:disabled{opacity:.45}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:4px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accs);color:var(--acc);font-size:.8rem;font-weight:600}
/* quiz */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:8px 0 12px}
.qcard .q{font-weight:600;font-size:1.1rem;margin-bottom:14px}
.opt{display:block;width:100%;text-align:right;padding:13px 14px;margin-bottom:9px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:.98rem}
.opt.right{border-color:var(--ok);background:var(--oks);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bads);color:var(--bad)}
.exp{font-size:.9rem;color:var(--muted);margin-top:6px}
.result{text-align:center;padding:10px 0}
.big{font-size:3rem;font-weight:700;color:var(--acc);line-height:1.1}
.review{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:.92rem}
.review .a{color:var(--ok);font-weight:600}
/* order game */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.slot{aspect-ratio:1/1.25;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);padding:4px;text-align:center;background:var(--card)}
.slot.filled{border-style:solid;border-color:var(--ok);color:var(--ink)}
.slot svg{width:100%;height:auto}
.pieces{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.piece{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.piece svg{width:70%;height:auto;display:block;margin:0 auto 4px}
.piece small{display:block;color:var(--muted);font-size:.8rem;line-height:1.4}
.piece.used{visibility:hidden}
.piece.shake{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{text-align:center;min-height:1.6em;font-weight:600;margin-bottom:8px}
.toast.ok{color:var(--ok)}.toast.bad{color:var(--bad)}
/* sort */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bin{border-radius:16px;padding:12px;min-height:110px;background:var(--card);border:1px solid var(--line)}
.bin b{display:block;text-align:center;margin-bottom:6px}
.chip{display:inline-block;font-size:.78rem;padding:3px 8px;border-radius:99px;margin:3px;background:var(--oks);color:var(--ok)}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;font-weight:600;font-size:1.15rem;margin:8px 0}
/* summary */
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.sum h3{margin:0 0 6px;font-size:1rem;color:var(--acc)}
.sum ul{margin:0;padding-inline-start:20px}
.sum p{margin:0}
table.cmp{width:100%;border-collapse:collapse;font-size:.92rem}
table.cmp td,table.cmp th{border:1px solid var(--line);padding:8px;text-align:center}

.mode.hero{background:linear-gradient(135deg,var(--acc),#6d4cff);color:#fff;border:none}
.mode.hero span{color:rgba(255,255,255,.88)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chipb{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.88rem;font-weight:600}
.chipb.on{background:var(--acc);color:#fff;border-color:transparent}
#stage{position:relative;height:min(56vh,460px);border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#ffffff 0%,#e6ece6 75%);border:1px solid var(--line);touch-action:none}
@media (prefers-color-scheme:dark){#stage{background:radial-gradient(circle at 50% 35%,#2c332d 0%,#151815 75%)}}
#stage canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;background:rgba(255,255,255,.93);color:#1f2a24;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:opacity .3s;opacity:0}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
.info3d{position:absolute;left:10px;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.88rem;box-shadow:0 4px 16px rgba(0,0,0,.18);transform:translateY(140%);transition:transform .3s;pointer-events:none}
.info3d.on{transform:none}
.info3d b{display:block;color:var(--acc)}
.p3{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.p3 h3{margin:4px 0 6px;font-size:1.08rem;color:var(--acc)}
.std{font-size:.95rem}
.dots{display:flex;gap:5px;align-items:center}.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);cursor:pointer;transition:width .2s}.dots i.on{background:var(--acc);width:18px}
.tip{text-align:center;color:var(--muted);font-size:.78rem;margin:8px 0 0}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-top:12px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);color:var(--acc)}
.scrub{width:100%;margin-top:14px;accent-color:var(--acc)}
.scrubl{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted)}
.qbtn{width:100%;margin-top:12px}.qz{margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- SVG helpers ----------
const X=(x,y,s,w=4)=>`<path d="M${x-s} ${y-s}L${x+s} ${y+s}M${x+s} ${y-s}L${x-s} ${y+s}" stroke="var(--chrom)" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
const cell=`<circle cx="50" cy="50" r="45" fill="var(--cell)" stroke="var(--cellb)" stroke-width="2.5"/>`;
const PH={
 pro:`<svg viewBox="0 0 100 100">${cell}<circle cx="50" cy="50" r="27" fill="none" stroke="var(--cellb)" stroke-width="2" stroke-dasharray="5 4"/>${X(38,38,7)}${X(62,40,7)}${X(40,62,7)}${X(61,62,7)}</svg>`,
 meta:`<svg viewBox="0 0 100 100">${cell}${[24,40,56,72,50].map(y=>`<path d="M10 50L50 ${y}M90 50L50 ${y}" stroke="var(--cellb)" stroke-width="1" opacity=".7"/>`).join('')}<path d="M50 10V90" stroke="var(--muted)" stroke-dasharray="3 3"/>${[26,42,58,74].map(y=>X(50,y,6,3.5)).join('')}</svg>`,
 ana:`<svg viewBox="0 0 100 100">${cell}<path d="M50 10V90" stroke="var(--muted)" stroke-dasharray="3 3"/>${[28,44,60,74].map(y=>`<path d="M34 ${y-6}L26 ${y}L34 ${y+6}M66 ${y-6}L74 ${y}L66 ${y+6}" stroke="var(--chrom)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 50L26 ${y}M88 50L74 ${y}" stroke="var(--cellb)" stroke-width="1" opacity=".7"/>`).join('')}</svg>`,
 telo:`<svg viewBox="0 0 100 100">${[27,73].map(c=>`<circle cx="${c}" cy="50" r="22" fill="var(--cell)" stroke="var(--cellb)" stroke-width="2.5"/><circle cx="${c}" cy="50" r="12" fill="none" stroke="var(--cellb)" stroke-width="1.5"/>${X(c,50,5,3)}`).join('')}</svg>`
};
const PHASES=[
 {k:'pro',n:'المرحلة التمهيدية',d:'تتكاثف الصبغيات ويزول الغلاف النووي'},
 {k:'meta',n:'المرحلة الاستوائية',d:'تصطف الصبغيات على خط الاستواء'},
 {k:'ana',n:'المرحلة الانفصالية',d:'ينفصل الكروماتيدان وينتقل كل منهما نحو أحد القطبين'},
 {k:'telo',n:'المرحلة النهائية',d:'تتكون خليتان بنتان متماثلتان وراثياً'}
];

// ---------- Content ----------
const L=[{
 id:'l1',color:'var(--l1)',soft:'var(--l1s)',
 title:'آليات النمو والتجديد الخلوي والانقسام',
 cards:[
  ['ما هو النمو؟','زيادة أبعاد وكتلة الكائن الحي، ويحدث بآليتين:<ul><li>زيادة عدد الخلايا (الانقسام الخيطي المتساوي)</li><li>زيادة حجم الخلايا (الاستطالة)</li></ul>'],
  ['أين توجد مناطق النمو عند النبات؟','في نهايات الجذر والساق، وتسمى <b>القمم النامية</b>.'],
  ['ما هي المنطقة المرستيمية؟','منطقة فيها انقسامات خلوية كثيرة (زيادة عدد الخلايا).'],
  ['ما هي منطقة الاستطالة؟','المنطقة التي تزداد فيها أبعاد الخلايا.'],
  ['كيف يحدث النمو عند الحيوان؟','على مستوى الأنسجة المتخصصة، خاصة <b>النسيج الغضروفي</b> بفضل خلاياه الإنشائية.'],
  ['كيف تستطيل الخلايا؟','بامتصاص الماء داخل الخلايا، فتنتفخ الفجوات وتزداد أبعادها.'],
  ['عرّف الانقسام الخيطي المتساوي (La mitose)','انقسام على مستوى الخلايا تنقسم فيه الخلية الأم إلى خليتين بنتين متماثلتين وراثياً وتحملان نفس الصيغة الصبغية <b>(2ن)</b>.'],
  ['ماذا يحدث في المرحلة التمهيدية؟','تتكاثف الصبغيات، ويزول الغلاف النووي.'],
  ['ماذا يحدث في المرحلة الاستوائية؟','تصطف الصبغيات على خط الاستواء.'],
  ['ماذا يحدث في المرحلة الانفصالية؟','ينفصل الكروماتيدان، وينتقل كل منهما نحو أحد القطبين.'],
  ['ماذا يحدث في المرحلة النهائية؟','تتكون خليتان بنتان متماثلتان وراثياً.'],
  ['صف بنية الصبغي أثناء الانقسام','كروماتيدان شقيقان مرتبطان بالقسيم المركزي. يتضاعف ADN قبل الانقسام فيصبح الصبغي مكوناً من كروماتيدين.'],
  ['ما أهمية الانقسام الخيطي المتساوي؟','<ul><li>زيادة عدد الخلايا وبالتالي نمو الكائن الحي</li><li>تجديد الخلايا وتعويض التالف منها</li><li>الحفاظ على ثبات عدد الصبغيات</li><li>المحافظة على الصفات الوراثية</li></ul>'],
  ['الفرق بين الانقسام عند الخلية الحيوانية والنباتية','<b>الحيوانية:</b> اختناق هيولي (تضيق الغشاء)<br><b>النباتية:</b> صفيحة خلوية (حاجز وسطي)']
 ],
 quiz:[
  ['النمو هو:',['زيادة أبعاد وكتلة الكائن الحي','زيادة عدد الأعضاء فقط','نقص حجم الخلايا','تعويض الخلايا التالفة فقط'],'يحدث بزيادة عدد الخلايا وزيادة حجمها.'],
  ['تسمى مناطق النمو في نهايات الجذر والساق:',['القمم النامية','الأنسجة الغضروفية','الأوعية الخشبية','الشعيرات الجذرية']],
  ['المنطقة التي تحدث فيها انقسامات خلوية كثيرة هي:',['المنطقة المرستيمية','منطقة الاستطالة','منطقة الشعيرات الجذرية','اللحاء']],
  ['في منطقة الاستطالة:',['تزداد أبعاد الخلايا','يزداد عدد الخلايا بسرعة','يزول الغلاف النووي','تتوقف الخلايا عن امتصاص الماء']],
  ['يحدث النمو عند الحيوان خاصة على مستوى:',['النسيج الغضروفي','النسيج العصبي','الدم','الشعر']],
  ['تستطيل الخلايا بفضل:',['امتصاص الماء فتنتفخ الفجوات','تضاعف ADN','تكاثف الصبغيات','زوال الغلاف النووي']],
  ['الخليتان البنتان الناتجتان عن الانقسام الخيطي المتساوي:',['متماثلتان وراثياً وتحملان 2ن','مختلفتان وراثياً','تحمل كل منهما ن فقط','تحمل كل منهما 4ن']],
  ['تتكاثف الصبغيات ويزول الغلاف النووي في المرحلة:',['التمهيدية','الاستوائية','الانفصالية','النهائية']],
  ['تصطف الصبغيات على خط الاستواء في المرحلة:',['الاستوائية','التمهيدية','الانفصالية','النهائية']],
  ['ينفصل الكروماتيدان ويتجه كل منهما نحو أحد القطبين في المرحلة:',['الانفصالية','الاستوائية','التمهيدية','النهائية']],
  ['تتكون خليتان بنتان في المرحلة:',['النهائية','الانفصالية','الاستوائية','التمهيدية']],
  ['يرتبط الكروماتيدان الشقيقان بواسطة:',['القسيم المركزي','الغلاف النووي','الفجوة','الصفيحة الخلوية']],
  ['يتضاعف ADN:',['قبل الانقسام','أثناء المرحلة الاستوائية','أثناء المرحلة النهائية','لا يتضاعف أبداً'],'لذلك يكون الصبغي مكوناً من كروماتيدين عند بداية الانقسام.'],
  ['تنقسم الخلية الحيوانية في نهاية الانقسام بواسطة:',['اختناق هيولي (تضيق الغشاء)','صفيحة خلوية (حاجز وسطي)','انتفاخ الفجوات','زوال القسيم المركزي']],
  ['تنقسم الخلية النباتية في نهاية الانقسام بواسطة:',['صفيحة خلوية (حاجز وسطي)','اختناق هيولي (تضيق الغشاء)','تكاثف الصبغيات','امتصاص الماء']],
  ['أي مما يلي <u>ليس</u> من أهمية الانقسام الخيطي المتساوي؟',['تغيير الصفات الوراثية','تجديد الخلايا وتعويض التالف','الحفاظ على ثبات عدد الصبغيات','زيادة عدد الخلايا'],'الانقسام يحافظ على الصفات الوراثية ولا يغيرها.']
 ],
 sort:{a:'🌱 النبات',b:'🦴 الحيوان',items:[['القمم النامية','a'],['نهايات الجذر والساق','a'],['المنطقة المرستيمية','a'],['منطقة الاستطالة','a'],['صفيحة خلوية (حاجز وسطي)','a'],['النسيج الغضروفي','b'],['الخلايا الإنشائية','b'],['اختناق هيولي (تضيق الغشاء)','b']]},
 summary:()=>`
  <div class="sum"><h3>1. مظاهر النمو</h3><p>النمو = زيادة أبعاد وكتلة الكائن الحي، بآليتين: زيادة عدد الخلايا (الانقسام الخيطي المتساوي) وزيادة حجمها (الاستطالة).</p></div>
  <div class="sum"><h3>2. مناطق النمو</h3><ul><li><b>النبات:</b> القمم النامية في نهايات الجذر والساق ← المنطقة المرستيمية (انقسامات كثيرة) + منطقة الاستطالة (تزداد أبعاد الخلايا).</li><li><b>الحيوان:</b> الأنسجة المتخصصة، خاصة النسيج الغضروفي بفضل خلاياه الإنشائية.</li></ul></div>
  <div class="sum"><h3>3. آليات النمو</h3><ul><li>زيادة عدد الخلايا: بالانقسام الخيطي المتساوي.</li><li>استطالة الخلايا: امتصاص الماء ← انتفاخ الفجوات ← زيادة الأبعاد.</li></ul></div>

let F;
function cards(i,onlyUnknown){
 const l=L[i];theme(l);
 let idx=l.cards.map((_,j)=>j);if(onlyUnknown)idx=idx.filter(j=>!S.known[l.id+j]);
 if(!idx.length){app.innerHTML=hdr('البطاقات',l.title,`lesson(${i})`)+`<div class="result"><div class="big">🎉</div><p>كل البطاقات محفوظة!</p><button class="btn pri" onclick="resetKnown(${i})">إعادة البدء من جديد</button></div>`;return}
 F={i,order:shuffle(idx),p:0};drawCard();
}
function resetKnown(i){L[i].cards.forEach((_,j)=>delete S.known[L[i].id+j]);save();cards(i)}
function drawCard(){
 const l=L[F.i];
 if(F.p>=F.order.length){app.innerHTML=hdr('البطاقات',l.title,`lesson(${F.i})`)+`<div class="result"><div class="big">${knownCount(l)}/${l.cards.length}</div><p>بطاقة محفوظة</p><div class="row"><button class="btn" onclick="cards(${F.i},true)">راجع غير المحفوظة</button><button class="btn pri" onclick="lesson(${F.i})">رجوع</button></div></div>`;return}
 const j=F.order[F.p],c=l.cards[j];
 app.innerHTML=hdr('البطاقات',l.title,`lesson(${F.i})`)+`<div class="meta"><span>${F.p+1} / ${F.order.length}</span>${S.known[l.id+j]?'<span class="pill">محفوظة ✓</span>':''}</div>
 <div class="fc" id="fc" onclick="this.classList.toggle('flip')"><div class="fc-in"><div class="face front"><div class="q">${c[0]}</div><div class="hint">اضغط لقلب البطاقة</div></div><div class="face backf"><div class="tag">${c[0]}</div><div>${c[1]}</div></div></div></div>
 <div class="row"><button class="btn no" onclick="mark(false)">✗ لم أحفظها</button><button class="btn ok" onclick="mark(true)">✓ أعرفها</button></div>
 <div class="row" style="margin-top:10px"><button class="btn" ${F.p?'':'disabled'} onclick="F.p--;drawCard()">السابقة</button><button class="btn" onclick="F.p++;drawCard()">تخطي</button></div>`;
}
function mark(k){const l=L[F.i],j=F.order[F.p];if(k)S.known[l.id+j]=1;else delete S.known[l.id+j];save();F.p++;drawCard()}

// quiz
let Q;
function quiz(i){
 let pool;
 if(i<0){theme(null);pool=shuffle(L.flatMap((l,li)=>l.quiz.map(q=>[...q,li]))).slice(0,15)}
 else{theme(L[i]);pool=shuffle(L[i].quiz)}
 Q={i,pool:pool.map(q=>({q:q[0],ans:q[1][0],opts:shuffle(q[1]),exp:q[2]||''})),p:0,score:0,wrong:[],done:false};
 drawQ();
}
function drawQ(){
 const back=Q.i<0?'home()':`lesson(${Q.i})`,title=Q.i<0?'اختبار شامل':'اختبار',sub=Q.i<0?'الدرسان':L[Q.i].title;
 if(Q.p>=Q.pool.length){
  const pct=Math.round(Q.score/Q.pool.length*100);
  app.innerHTML=hdr(title,sub,back)+`<div class="result"><div class="big">${Q.score}/${Q.pool.length}</div><p>${pct>=90?'ممتاز! 🌟':pct>=70?'جيد جداً 👏':pct>=50?'مقبول، واصل المراجعة 💪':'راجع الملخص ثم أعد المحاولة 📖'}</p></div>
  <div class="row"><button class="btn" onclick="${back}">رجوع</button><button class="btn pri" onclick="quiz(${Q.i})">إعادة الاختبار</button></div>
  ${Q.wrong.length?`<h2 style="margin:20px 0 4px">أخطاؤك</h2>`+Q.wrong.map(w=>`<div class="review"><div>${w.q}</div><div>إجابتك: <s>${w.your}</s></div><div class="a">الصحيح: ${w.ans}</div></div>`).join(''):''}`;
  scrollTo(0,0);return;
 }
 const q=Q.pool[Q.p];
 app.innerHTML=hdr(title,sub,back)+`<div class="meta"><span>السؤال ${Q.p+1} / ${Q.pool.length}</span><span>النتيجة: ${Q.score}</span></div><div class="bar"><i style="width:${Q.p/Q.pool.length*100}%;background:var(--acc)"></i></div>
 <div class="qcard"><div class="q">${q.q}</div>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" onclick="pick(${k})">${o}</button>`).join('')}<div id="exp"></div></div>
 <button class="btn pri" id="next" style="width:100%;display:none" onclick="Q.p++;drawQ()">التالي ←</button>`;
}
function pick(k){
 const q=Q.pool[Q.p];if(q.answered)return;q.answered=1;
 const ok=q.opts[k]===q.ans;if(ok)Q.score++;else Q.wrong.push({q:q.q,your:q.opts[k],ans:q.ans});
 document.querySelectorAll('.opt').forEach(b=>{const o=q.opts[b.dataset.k];if(o===q.ans)b.classList.add('right');else if(+b.dataset.k===k)b.classList.add('wrong')});
 $('#exp').innerHTML=`<div class="exp">${ok?'✓ إجابة صحيحة':'✗ الإجابة الصحيحة: <b>'+q.ans+'</b>'}${q.exp?'<br>'+q.exp:''}</div>`;
 $('#next').style.display='block';
}

function drawO(msg='',cls=''){

 app.innerHTML=hdr('رتّب مراحل الانقسام','الانقسام الخيطي المتساوي',"lesson(0)")+
 `<p class="sub" style="margin-bottom:8px">اضغط على المراحل بالترتيب الصحيح، من الأولى إلى الأخيرة.</p>
 <div class="slots">${[0,1,2,3].map(s=>O.placed[s]!==undefined?`<div class="slot filled">${PH[PHASES[s].k]}<b>${s+1}. ${PHASES[s].n.replace('المرحلة ','')}</b></div>`:`<div class="slot">${s+1}</div>`).join('')}</div>
 <div class="toast ${cls}">${msg}</div>
 ${done?`<div class="result"><div class="big">${O.err?'👍':'🏆'}</div><p>${O.err?`أتممت الترتيب مع ${O.err} خطأ`:'ترتيب مثالي بدون أخطاء!'}</p></div>
  ${PHASES.map((p,i)=>`<div class="review"><b>${i+1}. ${p.n}:</b> ${p.d}.</div>`).join('')}
  <div class="row" style="margin-top:14px"><button class="btn" onclick="lesson(0)">رجوع</button><button class="btn pri" onclick="order()">إعادة اللعب</button></div>`
 :`<div class="pieces">${O.pieces.map(i=>`<button class="piece ${O.placed.includes(i)?'used':''}" id="pc${i}" onclick="place(${i})">${PH[PHASES[i].k]}<small>${PHASES[i].d}</small></button>`).join('')}</div>`}`;
}
function place(i){
 if(i===O.placed.length){O.placed.push(i);drawO('✓ صحيح: '+PHASES[i].n,'ok')}
 else{O.err++;const el=$('#pc'+i);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');const t=$('.toast');t.className='toast bad';t.textContent='✗ ليست هذه المرحلة رقم '+(O.placed.length+1)}
}

 `<div class="meta"><span>${Math.min(G.p+1,G.items.length)} / ${G.items.length}</span><span>أخطاء: ${G.err}</span></div>
 ${done?`<div class="result"><div class="big">${G.err?'👍':'🏆'}</div><p>${G.err?`انتهيت مع ${G.err} خطأ`:'تصنيف مثالي!'}</p></div>`
 :`<div class="item">${G.items[G.p][0]}</div><div class="toast ${cls}">${msg}</div><div class="row"><button class="btn pri" onclick="drop('a')">${s.a}</button><button class="btn pri" onclick="drop('b')">${s.b}</button></div>`}
 <div class="bins"><div class="bin"><b>${s.a}</b>${G.a.map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="bin"><b>${s.b}</b>${G.b.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div>
 ${done?`<div class="row"><button class="btn" onclick="lesson(${G.i})">رجوع</button><button class="btn pri" onclick="sortGame(${G.i})">إعادة اللعب</button></div>`:''}`;
}
function drop(side){
 const [t,c]=G.items[G.p];
 if(side===c){G[c].push(t);G.p++;drawG('✓ صحيح','ok')}
 else{G.err++;drawG('✗ خطأ، حاول مرة أخرى','bad')}
}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ---------- helpers ----------
const sm=(x,a,b)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

const curve=pts=>{const c=new THREE.CatmullRomCurve3(pts.map(p=>p.isVector3?p.clone():v3(...p)),false,'centripetal');c.len=c.getLength();return c};

function flow(parent,curves,n,color,size,speed,offset){

    P.forEach((p,i)=>{const c=curves[p.c];p.u=(p.u+dt*speed/c.len)%1;d.position.copy(c.getPointAt(p.u)).add(p.j);
      const e=Math.min(1,p.u/.05,(1-p.u)/.05);d.scale.setScalar(Math.max(.001,this.vis*e));d.updateMatrix();im.setMatrixAt(i,d.matrix)});
    im.instanceMatrix.needsUpdate=true}};

function lin(parent,n,color,size,gen,dur){
  const im=noPick(new THREE.InstancedMesh(new THREE.SphereGeometry(size,8,6),M(color,{emissive:color,emissiveIntensity:.6}),n));parent.add(im);
  const P=[...Array(n)].map(()=>Object.assign(gen(),{u:Math.random()}));
  const d=new THREE.Object3D();
  return {on:1,vis:1,update(dt){this.vis+=(this.on-this.vis)*Math.min(1,dt*4);im.visible=this.vis>.02;if(!im.visible)return;
    P.forEach((p,i)=>{p.u+=dt/dur;if(p.u>=1){Object.assign(p,gen());p.u=0}d.position.lerpVectors(p.a,p.b,p.u);
      const e=Math.min(1,p.u/.1,(1-p.u)/.1);d.scale.setScalar(Math.max(.001,this.vis*e));d.updateMatrix();im.setMatrixAt(i,d.matrix)});
    im.instanceMatrix.needsUpdate=true}};
}

// ---------- engine ----------
let R,cam,ctl,scn,S,stepI=0,raf=0,fly=null,stage,ro,camKey='',time=0;
const clock=new THREE.Clock(),ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),tv=v3();
const $=id=>document.getElementById(id);
const V={};

function ensureR(){

  const el=R.domElement;el.style.touchAction='none';let d=null;
  el.addEventListener('pointerdown',e=>{d=[e.clientX,e.clientY]});

}
V.open=(li,si)=>{
  V.close();stage=$('stage');if(!stage)return;ensureR();
  stage.insertBefore(R.domElement,stage.firstChild);
  scn=new THREE.Scene();cam=new THREE.PerspectiveCamera(45,1,.05,100);
  ctl=new OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=1.2;ctl.maxDistance=14;
  scn.add(new THREE.HemisphereLight(0xffffff,0x667788,1.5));const dl=new THREE.DirectionalLight(0xffffff,1.7);dl.position.set(3,6,5);scn.add(dl);
  S=SC[li][si](scn);stepI=0;camKey='';time=0;
  const le=$('labels');le.innerHTML='';(S.labels||[]).forEach(l=>{l.el=document.createElement('div');l.el.className='lab';le.appendChild(l.el)});

};
V.close=()=>{
  cancelAnimationFrame(raf);raf=0;if(ro){ro.disconnect();ro=null}
  if(scn){scn.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)[].concat(o.material).forEach(m=>m.dispose())});scn=null}
  if(ctl){ctl.dispose();ctl=null}S=null;fly=null;if(R&&R.domElement.parentNode)R.domElement.remove();

function resize(){if(!stage)return;const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}

}
function labels(){
  if(!S.labels)return;const w=stage.clientWidth,h=stage.clientHeight;
  S.labels.forEach(l=>{
    if(!l.show()){l.el.style.opacity=0;return}
    tv.copy(typeof l.p==='function'?l.p():l.p).project(cam);
    const vis=tv.z<1&&Math.abs(tv.x)<1.05&&Math.abs(tv.y)<1.05;l.el.style.opacity=vis?1:0;
    const txt=typeof l.t==='function'?l.t():l.t;if(l.el.textContent!==txt)l.el.textContent=txt;
    l.el.style.transform=`translate(${(tv.x*.5+.5)*w}px,${(-tv.y*.5+.5)*h}px) translate(-50%,-50%)`;
  });
}
function pick(e){
  const r=R.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,cam);
  let fallback=null;
  for(const h of ray.intersectObjects(scn.children,true)){
    let ok=true,inf=null;for(let q=h.object;q;q=q.parent){if(!q.visible||q.userData.noPick){ok=false;break}if(!inf&&q.userData.info)inf=q.userData.info}
    if(!ok)continue;const m=h.object.material,see=m&&m.transparent?m.opacity:1;if(see<.03)continue;
    if(see<.6){if(inf&&!fallback)fallback=inf;continue}
    if(inf){showInfo(inf);return}break;
  }

}
function showInfo(i){if(typeof i==='function')i=i();const b=$('info3d');b.innerHTML=`<b>${i.t}</b>${i.d||''}`;b.classList.add('on')}
function hideInfo(){const b=$('info3d');if(b)b.classList.remove('on')}
function buildCtrl(){
  $('ctrl').innerHTML=`<div class="p3"><div class="meta"><span id="stn"></span><span class="dots" id="dots"></span></div><h3 id="stt"></h3><div id="std" class="std"></div><div id="extra"></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="pv">→ السابق</button><button class="btn pri" id="nx">التالي ←</button></div></div>
  <p class="tip">👆 اسحب لتدوير المشهد · إصبعان للتكبير · اضغط على أي جزء لمعرفة المزيد</p>`;
  $('pv').onclick=()=>go(stepI-1);$('nx').onclick=()=>go(stepI+1>=S.steps.length?0:stepI+1);
  $('dots').innerHTML=S.steps.map((_,k)=>`<i data-k="${k}"></i>`).join('');$('dots').onclick=e=>{const k=e.target.dataset.k;if(k!==undefined)go(+k)};
  if(S.extra)S.extra($('extra'));

function go(i,instant){
  if(!S)return;i=Math.max(0,Math.min(S.steps.length-1,i));stepI=i;const st=S.steps[i];if(S.onStep)S.onStep(i);

// ================= SCENE: growth zones =================
function growth(scene){

  // root tip cells
  const cw=.2,COLS=5,LAY=2;
  const zm={mer:T(0xf06292,.6,{emissive:0xf06292,emissiveIntensity:0}),el:T(0x81c784,.5,{emissive:0x81c784,emissiveIntensity:0}),mat:T(0xc5e1a5,.45)};
  const edgeG=new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),edgeM=new THREE.LineBasicMaterial({color:0x33691e,transparent:true,opacity:.55});
  const boxG=new THREE.BoxGeometry(1,1,1),vacG=new THREE.SphereGeometry(1,14,10),vacM=M(0x4fc3f7,{transparent:true,opacity:.8}),nucM=M(0x6a1b9a);
  const zinfo={mer:['المنطقة المرستيمية','خلايا صغيرة تنقسم باستمرار (انقسام خيطي متساوي) ← زيادة عدد الخلايا.'],el:['منطقة الاستطالة','خلايا تمتص الماء فتنتفخ فجواتها وتزداد أبعادها ← استطالة.'],mat:['خلايا مكتملة الاستطالة','تحمل الشعيرات الجذرية التي تمتص الماء والأملاح المعدنية.']};
  const rowsDef=[...Array(3)].map(()=>({z:'mat',b:.55})).concat([...Array(5)].map((_,e)=>({z:'el',b:.5-e*.07}))).concat([...Array(5)].map(()=>({z:'mer',b:.17})));
  const rows=rowsDef.map(r=>{const cells=[];
    for(let c=0;c<COLS;c++)for(let l=0;l<LAY;l++){
      const m=info(new THREE.Mesh(boxG,zm[r.z]),...zinfo[r.z]);m.position.set((c-2)*cw,0,(l-.5)*cw);m.add(noPick(new THREE.LineSegments(edgeG,edgeM)));root.add(m);
      const vac=noPick(new THREE.Mesh(vacG,vacM));root.add(vac);
      const nu=r.z==='mer'?[0,1].map(()=>{const n=noPick(ball(.03,nucM));root.add(n);return n}):null;

    }return {...r,cells}});
  const cap=info(ball(1,T(0xa1887f,.55)),'نهاية الجذر','تحمي القمة النامية للجذر أثناء تقدمه في التربة.');cap.scale.set(.55,.3,.28);root.add(cap);
  const zbox={mer:noPick(new THREE.LineSegments(edgeG,new THREE.LineBasicMaterial({color:0xd81b60,transparent:true,opacity:0}))),el:noPick(new THREE.LineSegments(edgeG,new THREE.LineBasicMaterial({color:0x2e7d32,transparent:true,opacity:0})))};

  const wp=[...Array(wN)].map(()=>({u:Math.random(),s:Math.random()<.5?1:-1,f:Math.random(),z:(Math.random()-.5)*.3}));let wv=0;const dd=new THREE.Object3D();

  const plates=[0,1].map(()=>{const pl=info(new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.14,28),cm),'النسيج الغضروفي (منطقة النمو)','نسيج متخصص تنقسم خلاياه الإنشائية باستمرار، فيطول العظم ← نمو الحيوان.');pl.rotation.z=Math.PI/2;bone.add(pl);return pl});
  const bc=[];plates.forEach((pl,k)=>{for(let j=0;j<7;j++){const s=noPick(ball(.04,M(0x0277bd)));bone.add(s);bc.push({s,k,a:j*.9,r:j?.17:0,ph:j*.7})}});
  function layoutBone(Lb,t){shaft.scale.y=Lb;[1,-1].forEach((sd,k)=>{plates[k].position.x=sd*(Lb/2+.05);epi[k].position.x=sd*(Lb/2+.42)});

    {t:'أين ينمو النبات؟',d:'يحدث النمو عند النبات في <b>القمم النامية</b>: في نهاية الساق ونهاية الجذر (النقاط المضيئة). اضغط عليها!',cam:[3,1,5.8],target:[0,.25,0]},

    {t:'منطقة الاستطالة',d:'فوق المنطقة المرستيمية، <b>تمتص الخلايا الماء</b> 💧 فتنتفخ فجواتها (الكريات الزرقاء) و<b>تزداد أبعادها</b> ← استطالة الخلايا.',cam:[2.1,-.9,3.7],target:[0,-1.1,0]},

  RT.forEach((c,k)=>g.add(info(tube(c,k?.03:.05,rootM,24),'الجذور','تمتص الماء والأملاح المعدنية عبر الشعيرات الجذرية، وتستعمل المادة العضوية في التنفس والنمو.')));
  RT.forEach(c=>{const tip=v3(...c[c.length-1]),prev=v3(...c[c.length-2]);for(let k=0;k<8;k++){const h=info(new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,.17,4),rootM),'الشعيرات الجذرية','تمتص الماء والأملاح المعدنية من التربة.');h.position.copy(tip.clone().lerp(prev,.12+k*.05));h.rotation.set(k*1.1,k*2.3,k*.7);g.add(h)}});
  const tub=[[0,-.25,0],[.45,-.35,-.3],[.8,-.48,-.45]];g.add(tube(tub,.022,rootM,12));
  const tubM=M(0xc9a26b,{emissive:0xffb300,emissiveIntensity:0}),tuber=info(ball(1,tubM),'الدرنة (عضو مدخر)','تُخزَّن فيها المادة العضوية على شكل نشا.');tuber.scale.set(.3,.2,.22);tuber.position.set(1.02,-.55,-.52);g.add(tuber);
  const sunP=v3(2.4,4.3,-1.3),sun=info(ball(.35,new THREE.MeshBasicMaterial({color:0xffd54f})),'الشمس','مصدر الضوء: شرط من شروط التركيب الضوئي.');sun.position.copy(sunP);g.add(sun);
  const halo=noPick(ball(.6,new THREE.MeshBasicMaterial({color:0xffe082,transparent:true,opacity:.25,depthWrite:false})));halo.position.copy(sunP);g.add(halo);

  const tipsRev=RT.map((c,k)=>[...c].reverse().concat(k?[[0,-.1,0]]:[]));
  const xc=[0,1,2,3,4,5].map(i=>{const l=leaves[(i+(i>3?1:0))%4];return curve([...tipsRev[i%4],[0,.4,0],[0,l.y-.3,0],l.base,l.p])});
  const l2s=l=>[l.p,l.base,[0,l.y-.3,0]];
  const pc=[
    curve([...l2s(leaves[0]),[0,1.6,0],[0,1.2,0],[-.3,1.12,.15],[-.48,.98,.27],[-.52,.83,.29]]),
    curve([...l2s(leaves[3]),[0,3.02,0]]),
    curve([...l2s(leaves[1]),[0,.8,0],[0,-.25,0],...tub.slice(1),[1.02,-.55,-.52]]),
    curve([...l2s(leaves[2]),[0,.6,0],[0,-.1,0],...RT[0].slice(1)]),
    curve([...l2s(leaves[0]),[0,.8,0],[0,-.45,0],...RT[1].slice(1)]),
    curve([...l2s(leaves[1]),[0,.8,0],[0,-.8,0],...RT[2].slice(1)]),
  ];
  const X=flow(g,xc,70,0x29b6f6,.032,.55,v3(0,0,.045)),P=flow(g,pc,70,0xff9800,.034,.5,v3(0,0,-.045));
  const rl=()=>leaves[Math.random()*4|0];
  const light=lin(g,26,0xffee58,.026,()=>{const l=rl();return {a:sunP.clone(),b:l.p.clone().add(v3((Math.random()-.5)*.5,.05,(Math.random()-.5)*.25))}},1.1);
  const co2=lin(g,14,0x9e9e9e,.05,()=>{const l=rl();return {a:l.p.clone().add(v3(Math.random()-.5,Math.random()*.6,Math.random()-.5).normalize().multiplyScalar(1.3)),b:l.p.clone()}},2.2);
  const vap=lin(g,18,0xb3e5fc,.035,()=>{const l=rl();return {a:l.p.clone(),b:l.p.clone().add(v3(l.s*.6*Math.random(),.9+Math.random()*.5,(Math.random()-.5)*.6))}},2);
  const sys=[X,P,light,co2,vap];
  let btnX,btnP;
  const syncBtns=()=>{if(btnX){btnX.classList.toggle('on',!!X.on);btnP.classList.toggle('on',!!P.on)}};
  const steps=[
    {t:'نظرة عامة',d:'يصنع النبات غذاءه في <b>الأوراق</b> ثم يوزعه على كل أعضائه، وفي نفس الوقت يصعد الماء من <b>الجذور</b>.<br>🔵 نسغ خام · 🟠 نسغ كامل. اضغط على أي جزء!',f:[1,1,0,0],cam:[4.2,1.6,5.8],target:[0,.7,0]},
    {t:'1. مصدر المادة العضوية',d:'في <b>الأوراق</b> (مقر التركيب الضوئي) تُصنع المادة العضوية (<b>سكريات</b>) بشرط:<br>☀️ وجود الضوء · 🟢 وجود اليخضور · 💧 توفر الماء و CO₂',f:[1,0,1,0],cam:[2.6,3.4,3.6],target:[.2,2.3,0]},
    {t:'2. النسغ الخام (صاعد)',d:'تمتص <b>الشعيرات الجذرية</b> الماء والأملاح المعدنية، فيصعد <b>النسغ الخام</b> في <b>الأوعية الخشبية</b> من الجذور إلى الأوراق، بفعل <b>الخاصية الشعرية وقوة النتح</b> (تبخر الماء من الأوراق).',f:[1,0,0,1],cam:[3.4,.4,4.8],target:[0,.3,0]},
    {t:'3. النسغ الكامل (نازل)',d:'تنتقل المادة العضوية من الأوراق على شكل <b>محلول سكري</b> عبر <b>اللحاء</b> نحو الأعضاء المستهلكة (الجذور، الثمار…) وأعضاء التخزين، بفضل <b>الضغط الأسموزي</b>.',f:[0,1,0,0],cam:[-3.6,1.2,4.6],target:[0,.6,0]},
    {t:'4. أماكن الاستهلاك والتخزين',d:'🌱 <b>الأعضاء النامية</b>: تستعملها في النمو<br>🌿 <b>الجذور</b>: في التنفس والنمو<br>🥔 <b>الأعضاء المدخرة</b>: تخزنها على شكل <b>نشا</b> (البذور، الدرنات)<br>اضغط على الأعضاء المضيئة.',f:[0,1,0,0],sink:1,cam:[3.2,.6,5],target:[0,.4,0]},
    {t:'دوران النسغ كاملاً',d:'⬆️ خام في الأوعية الخشبية + ⬇️ كامل في اللحاء.<br>الأهمية: تغذية كل الأعضاء بالمادة العضوية، تحقيق النمو والتطور، تخزين الفائض، والمحافظة على توازن النبات وحيويته.',f:[1,1,0,1],cam:[4.6,1.8,6.2],target:[0,.7,0]}
  ];
  return {steps,
    labels:[
      lb('☀️ الضوء',()=>sunP.clone().add(v3(0,-.65,0)),()=>stepI===1),
      lb('CO₂',v3(1.75,3.05,.3),()=>stepI===1),
      lb('💧 ماء',v3(.22,1.0,.1),()=>stepI===1),
      lb('سكريات تتشكل',()=>leaves[0].p.clone().add(v3(.1,.28,0)),()=>stepI===1),
      lb('الأوعية الخشبية ⬆️',v3(.32,.9,.1),()=>stepI===2||stepI===5),
      lb('الشعيرات الجذرية',v3(1.1,-1.4,.25),()=>stepI===2),
      lb('النتح 💨',v3(1.3,3.35,0),()=>stepI===2),
      lb('اللحاء ⬇️',v3(-.3,1.6,-.1),()=>stepI===3||stepI===5),
      lb('ثمرة',v3(-.55,.55,.3),()=>stepI===3||stepI===4),
      lb('درنة: نشا',v3(1.05,-.88,-.5),()=>stepI===3||stepI===4),
      lb('قمة نامية: نمو',v3(0,3.32,0),()=>stepI===4),
      lb('جذور: تنفس ونمو',v3(-.95,-1.85,-.15),()=>stepI===4),
      lb('الأوراق',v3(-.85,2.42,-.1),()=>stepI===0),
      lb('الساق',v3(.22,1.2,0),()=>stepI===0),
      lb('الجذور',v3(.3,-2,0),()=>stepI===0),
    ],
    onStep(i){const f=steps[i].f;X.on=f[0];P.on=f[1];light.on=f[2];co2.on=f[2];vap.on=f[3];syncBtns()},
    extra(el){el.innerHTML=`<div class="seg"><button id="bx">⬆️ النسغ الخام</button><button id="bp">⬇️ النسغ الكامل</button></div>`;
      btnX=$('bx');btnP=$('bp');btnX.onclick=()=>{X.on=X.on?0:1;syncBtns()};btnP.onclick=()=>{P.on=P.on?0:1;syncBtns()};syncBtns()},
    update(dt,t){
      sys.forEach(s=>s.update(dt));const st=steps[stepI];
      leafM.emissiveIntensity=st.f[2]?.2+.18*Math.sin(t*3):0;
      const k=st.sink?.3+.3*Math.sin(t*4):0;budM.emissiveIntensity=k;fruitM.emissiveIntensity=k*.6;tubM.emissiveIntensity=k;rootM.emissiveIntensity=k*.5;
      halo.scale.setScalar(1+.1*Math.sin(t*2));
    }};
}

// ================= SCENE: conducting vessels =================
function vessels(scene){
  const g=new THREE.Group();scene.add(g);const H=4;
  g.add(noPick(new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,H,48,1,true),T(0x9ccc65,.12))));
  [-H/2,H/2].forEach(y=>{const r=noPick(new THREE.Mesh(new THREE.RingGeometry(1.27,1.32,64),new THREE.MeshBasicMaterial({color:0x558b2f,side:THREE.DoubleSide})));r.rotation.x=-Math.PI/2;r.position.y=y;g.add(r)});
  const xm=T(0x42a5f5,.3),xr=M(0x1e88e5,{transparent:true,opacity:1}),pm=T(0xffa726,.3),pd=M(0xef6c00,{transparent:true,opacity:.7,side:THREE.DoubleSide});
  const xs=[],ps=[];
  [0,1,2].forEach(k=>{const a=k*Math.PI*2/3+.3,xp=v3(Math.cos(a)*.45,0,Math.sin(a)*.45),pp=v3(Math.cos(a)*.92,0,Math.sin(a)*.92);xs.push(xp);ps.push(pp);
    const xv=info(new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,H,20,1,true),xm),'وعاء خشبي','ينقل النسغ الخام (ماء + أملاح معدنية) صعوداً من الجذور نحو الأوراق.');xv.position.copy(xp);g.add(xv);
    for(let y=-H/2+.15;y<H/2;y+=.22){const r=info(new THREE.Mesh(new THREE.TorusGeometry(.15,.018,6,20),xr),'وعاء خشبي','جداره مدعّم بحلقات، ينقل النسغ الخام صعوداً.');r.rotation.x=Math.PI/2;r.position.set(xp.x,y,xp.z);g.add(r)}
    const pv=info(new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,H,20,1,true),pm),'أنبوب لحائي','ينقل النسغ الكامل (محلول سكري) من الأوراق نحو باقي أعضاء النبات.');pv.position.copy(pp);g.add(pv);
    for(let y=-H/2+.4;y<H/2;y+=.7){const d=info(new THREE.Mesh(new THREE.CircleGeometry(.13,20),pd),'أنبوب لحائي','ينقل النسغ الكامل نزولاً من الأوراق.');d.rotation.x=-Math.PI/2;d.position.set(pp.x,y,pp.z);g.add(d)}
  });
  const off=()=>v3((Math.random()-.5)*.14,0,(Math.random()-.5)*.14);
  const xf=lin(g,36,0x29b6f6,.035,()=>{const c=xs[Math.random()*3|0],o=off();return {a:c.clone().add(o).setY(-H/2),b:c.clone().add(o).setY(H/2)}},3);
  const pf=lin(g,36,0xff9800,.035,()=>{const c=ps[Math.random()*3|0],o=off().multiplyScalar(.8);return {a:c.clone().add(o).setY(H/2),b:c.clone().add(o).setY(-H/2)}},3.5);
  let fx=1,fpv=1;
  const steps=[
    {t:'داخل الساق',d:'تحتوي الساق على نوعين من الأوعية الناقلة: <b>الأوعية الخشبية</b> 🔵 و<b>أنابيب اللحاء</b> 🟠.',f:[1,1]},
    {t:'الأوعية الخشبية',d:'تنقل <b>النسغ الخام</b> (الماء والأملاح المعدنية) <b>صعوداً</b> من الجذور نحو الأوراق، بفعل الخاصية الشعرية وقوة النتح.',f:[1,0]},
    {t:'أنابيب اللحاء',d:'تنقل <b>النسغ الكامل</b> (المادة العضوية على شكل محلول سكري) <b>نزولاً</b> من الأوراق نحو باقي الأعضاء، بفضل الضغط الأسموزي.',f:[0,1]},
    {t:'قارن بينهما',d:'<table class="cmp"><tr><th></th><th>🔵 النسغ الخام</th><th>🟠 النسغ الكامل</th></tr><tr><td>الاتجاه</td><td>صاعد</td><td>نازل</td></tr><tr><td>المحتوى</td><td>ماء + أملاح</td><td>مادة عضوية</td></tr><tr><td>الأوعية</td><td>الخشبية</td><td>اللحاء</td></tr><tr><td>القوة</td><td>شعرية + نتح</td><td>ضغط أسموزي</td></tr></table>',f:[1,1]}
  ].map(s=>Object.assign(s,{cam:[3.2,1.7,4.4],target:[0,0,0]}));
  return {steps,
    labels:[
      lb('⬆️ نحو الأوراق',v3(0,H/2+.3,0),()=>true),
      lb('⬇️ نحو الجذور',v3(0,-H/2-.3,0),()=>true),
      lb('وعاء خشبي',()=>xs[0].clone().setY(1.1),()=>stepI!==2),
      lb('أنبوب لحائي',()=>ps[0].clone().setY(.4),()=>stepI!==1),
    ],
    onStep(i){xf.on=steps[i].f[0];pf.on=steps[i].f[1]},
    update(dt){xf.update(dt);pf.update(dt);const f=steps[stepI].f;fx+=(f[0]-fx)*Math.min(1,dt*4);fpv+=(f[1]-fpv)*Math.min(1,dt*4);
      const a=.12+.88*fx,b=.12+.88*fpv;xm.opacity=.3*a;xr.opacity=a;pm.opacity=.3*b;pd.opacity=.7*b;g.rotation.y+=dt*.12}};
}

const SC=[[growth,mitosis,chromo],[sap,vessels]];
